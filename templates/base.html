<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IoT System Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar Navigation -->
        <nav class="sidebar bg-dark text-white p-0">
            <div class="sidebar-header p-3 border-bottom">
                <a class="navbar-brand text-white text-decoration-none" href="{{ url_for('dashboard') }}">
                    <i class="fas fa-home-automation"></i> IoT System
                </a>
            </div>
            
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link text-white {% if request.endpoint == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">
                        <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white {% if request.endpoint == 'data_sensor' %}active{% endif %}" href="{{ url_for('data_sensor') }}">
                        <i class="fas fa-chart-line me-2"></i> Data Sensor
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white {% if request.endpoint == 'action_history' %}active{% endif %}" href="{{ url_for('action_history') }}">
                        <i class="fas fa-history me-2"></i> Lịch sử
                    </a>
                </li>
                <li class="nav-item mt-auto">
                    <a class="nav-link text-white {% if request.endpoint == 'profile' %}active{% endif %}" href="{{ url_for('profile') }}">
                        <i class="fas fa-user me-2"></i> Hồ sơ người dùng
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <div class="main-content flex-fill">
            <!-- Top Header (optional) -->
            <header class="bg-light border-bottom p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <h4 class="mb-0">{% block page_title %}Dashboard{% endblock %}</h4>
                    <div class="d-flex align-items-center">
                        <span class="text-muted me-3">
                            <i class="fas fa-clock me-1"></i>
                            <span id="current-time"></span>
                        </span>
                        <div class="badge bg-success">Online</div>
                    </div>
                </div>
            </header>

            <!-- Main Content -->
            <main class="container-fluid p-4">
                {% block content %}{% endblock %}
            </main>

            <!-- Footer -->
            <footer class="bg-light mt-auto py-3 border-top">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-md-6">
                            <small class="text-muted">
                                © 2024 IoT System Dashboard. All rights reserved.
                            </small>
                        </div>
                        <div class="col-md-6 text-end">
                            <a href="#" class="text-decoration-none me-3"><i class="fab fa-twitter"></i></a>
                            <a href="#" class="text-decoration-none me-3"><i class="fab fa-linkedin"></i></a>
                            <a href="#" class="text-decoration-none"><i class="fab fa-github"></i></a>
                        </div>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    <!-- Script để hiển thị thời gian thực -->
    <script>
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('vi-VN');
            const timeElement = document.getElementById('current-time');
            if (timeElement) {
                timeElement.textContent = timeString;
            }
        }
        
        // Cập nhật thời gian mỗi giây
        setInterval(updateTime, 1000);
        updateTime(); // Hiển thị ngay lập tức
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
